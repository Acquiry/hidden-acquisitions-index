name: Verify sources

on:
  workflow_dispatch:
  push:
    paths: ["data/**", "scripts/**"]
  schedule:
    - cron: "17 16 * * 0"   # weekly, Monday ~03:17 Melbourne time

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Data rules check (sources, quote length, banned words, schema basics)
        run: mkdir -p reports && python scripts/check_data.py data/deals.json | tee reports/data_check.txt
      - name: Source check (fetch every link, confirm every quote)
        run: python scripts/verify_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: reports/
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "Verification reports $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No changes"
          git push
