name: Archive sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Find or create Wayback copies for sources without one
        run: python tools/archive_lookup.py
      - name: Commit the archive map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add reports/archive_map.json
          git commit -m "Archive map $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No changes"
          git pull --rebase
          git push
